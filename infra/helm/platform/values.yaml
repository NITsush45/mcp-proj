global:
  namespace: urumi
  domain: urumi.local

gateway:
  image: urumi/gateway:0.1.0
  replicas: 1
  port: 8080
  resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { cpu: 500m, memory: 512Mi } }

dashboard:
  image: urumi/dashboard:0.1.0
  replicas: 1
  port: 80
  resources: { requests: { cpu: 50m, memory: 64Mi }, limits: { cpu: 200m, memory: 128Mi } }

woocommerceMcp:
  image: urumi/woocommerce-mcp:0.1.0
  replicas: 1
  port: 8081
  resources: { requests: { cpu: 50m, memory: 128Mi }, limits: { cpu: 300m, memory: 256Mi } }

notesMcp:
  image: urumi/notes-mcp:0.1.0
  replicas: 1
  port: 8082
  resources: { requests: { cpu: 50m, memory: 64Mi }, limits: { cpu: 200m, memory: 128Mi } }

inventoryMcp:
  image: urumi/inventory-mcp:0.1.0
  replicas: 1
  port: 8083
  resources: { requests: { cpu: 50m, memory: 64Mi }, limits: { cpu: 200m, memory: 128Mi } }

postgres:
  image: postgres:16-alpine
  storage: 5Gi
  resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { cpu: 500m, memory: 512Mi } }

ingress:
  enabled: true
  className: nginx
  dashboardHost: dashboard.urumi.local
  gatewayHost: gateway.urumi.local
  tls: false

apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.global.namespace }}-sa
  namespace: {{ .Values.global.namespace }}
automountServiceAccountToken: false
---
# Upstream MCP servers accept traffic ONLY from the gateway (default-deny + allowlist).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mcp-servers-ingress
  namespace: {{ .Values.global.namespace }}
spec:
  podSelector:
    matchExpressions:
      - { key: app, operator: In, values: [woocommerce-mcp, notes-mcp, inventory-mcp] }
  policyTypes: [Ingress]
  ingress:
    - from: [{ podSelector: { matchLabels: { app: gateway } } }]
      ports:
        - { port: 8081 }
        - { port: 8082 }
        - { port: 8083 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-ingress
  namespace: {{ .Values.global.namespace }}
spec:
  podSelector: { matchLabels: { app: postgres } }
  policyTypes: [Ingress]
  ingress:
    - from: [{ podSelector: { matchLabels: { app: gateway } } }]
      ports: [{ port: 5432 }]
